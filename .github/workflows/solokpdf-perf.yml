name: SolokPDF startup performance

on:
  workflow_dispatch:

concurrency:
  group: solokpdf-perf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  startup:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v5
        with:
          path: .work/pdfium
          key: pdfium-win-x64-${{ hashFiles('cmd/solok-fetch-pdfium.ts') }}
      - uses: actions/cache@v5
        with:
          path: |
            .work/corpus/attention-1706.03762v7.pdf
            .work/corpus/bert-1810.04805.pdf
          key: solokpdf-perf-corpus-${{ hashFiles('.github/solokpdf-perf-corpus.json') }}
      - name: Fetch and verify corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($item in (Get-Content .github/solokpdf-perf-corpus.json -Raw | ConvertFrom-Json)) {
            $dir = Split-Path $item.path
            New-Item -ItemType Directory -Force $dir | Out-Null
            if (-not (Test-Path $item.path)) {
              Invoke-WebRequest -Uri $item.url -OutFile $item.path
            }
            $actual = (Get-FileHash $item.path -Algorithm SHA256).Hash
            if ($actual -ne $item.sha256) {
              throw "Corpus SHA-256 mismatch for $($item.path): expected $($item.sha256), got $actual. Source: $($item.url)"
            }
          }
      - name: Build release
        run: bun cmd/solok-build.ts -rel
      - name: Measure normal PDF open
        run: bun experiments/pdfium/normal-startup-ui.ts --ci --exe out/solokpdf-portable/SolokPDF.exe --output out/solok-perf/normal .work/corpus/attention-1706.03762v7.pdf .work/corpus/bert-1810.04805.pdf
      - name: Measure direct launch
        run: bun experiments/pdfium/direct-startup-ui.ts --ci --exe out/solokpdf-portable/SolokPDF.exe --output out/solok-perf/direct .work/corpus/attention-1706.03762v7.pdf .work/corpus/bert-1810.04805.pdf
      - name: Summarize pairs
        run: bun experiments/pdfium/startup-summary.ts out/solok-perf
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: solokpdf-startup-performance
          path: out/solok-perf/
          if-no-files-found: warn
          retention-days: 30
